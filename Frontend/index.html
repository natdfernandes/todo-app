<!DOCTYPE html>
<html lang="Pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="/imagens/logo-todo-app.svg" type="image/x-icon">
    <title>Todo App List</title>
</head>

<body>

    <header>
        <img class="imagem" src="/imagens/logo-todo-app.svg" alt="Logotipo todo app list">
        <h1 class="texto-h1">Todo List App</h1>
    </header>

    <main>
        <h2 class="texto-item">
            Lista de itens
        </h2>
        <ul>
            <li> Item 1
                <div>

                    <img src="/imagens/Trash.svg" alt="Icone de Lixeira">
                    <img src="/imagens/Edit.svg" alt="Icone de Editar">
                </div>
            </li>
            <li class="edicao">
                <input type="text" placeholder="Insira a descrição do item">
                <img src="/imagens/Save.svg" alt="Icone de salvar">
            </li>
            <li> Item 2
                <div>

                    <img src="/imagens/Trash.svg" alt="Icone de Lixeira">
                    <img src="/imagens/Edit.svg" alt="Icone de Editar">
                </div>
            </li>
            <li> Item 3
                <div>

                    <img src="/imagens/Trash.svg" alt="Icone de Lixeira">
                    <img src="/imagens/Edit.svg" alt="Icone de Editar">
                </div>
            </li>
            <li> Item 4
                <div>

                    <img src="/imagens/Trash.svg" alt="Icone de Lixeira">
                    <img src="/imagens/Edit.svg" alt="Icone de Editar">
                </div>
            </li>
            <li> Item 5
                <div>

                    <img src="/imagens/Trash.svg" alt="Icone de Lixeira">
                    <img src="/imagens/Edit.svg" alt="Icone de Editar">
                </div>
            </li>
            <li> Item 6
                <div>

                    <img src="/imagens/Trash.svg" alt="Icone de Lixeira">
                    <img src="/imagens/Edit.svg" alt="Icone de Editar">
                </div>
            </li>
            <li> Item 7
                <div>

                    <img src="/imagens/Trash.svg" alt="Icone de Lixeira">
                    <img src="/imagens/Edit.svg" alt="Icone de Editar">
                </div>
            </li>
        </ul>

        <button class="botao-estilo"><img src="/imagens/add.svg" alt="Adicionar"></button>

        <dialog closedby="any">
            <h3 class="adicionar-item">Adicione o novo item...</h3>
            <input type="text" placeholder="Insira a descrição do item" />
            <div class="grupo-botoes">
                <button class="botao botao-principal">Salvar</button>
                <button class="botao botao-secundario" id="close">Fechar</button>
            </div>
        </dialog>

    </main>

    <footer>
        <h3>
            Desenvolvido por: Natalia Dias Fernandes
        </h3>
    </footer>
</body>

<script>
    const button = document.querySelector("button")
    const modal = document.querySelector("dialog")
    const buttonClose = document.querySelector("dialog button#close")

    button.onclick = function () {
        modal.showModal()
    }

    buttonClose.onclick = function () {
        modal.close()
    }
</script>

</html>
