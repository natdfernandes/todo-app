<!DOCTYPE html>
<html lang="Pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="/imagens/logo-todo-app.svg" type="image/x-icon">
    <title>Todo App List</title>
</head>

<body>

    <header>
        <img class="imagem" src="/imagens/logo-todo-app.svg" alt="Logotipo todo app list">
        <h1 class="texto-h1">Todo List App</h1>
    </header>

    <main>
        <h2 class="texto-item">
            Lista de itens
        </h2>
        <ul>
            <li> Item 1
                <div>
                    <button>
                        <img src="/imagens/Trash.svg" alt="Icone de Lixeira">
                    </button>
                    <button class="botao-editar">
                        <img src="/imagens/Edit.svg" alt="Icone de Editar">
                    </button>
                </div>
            </li>
            <li class="edicao">
                <input type="text" placeholder="Insira a descrição do item">
                <img src="/imagens/Save.svg" alt="Icone de salvar">
            </li>
            <li> Item 2
                <div>
                    <button>
                        <img src="/imagens/Trash.svg" alt="Icone de Lixeira">
                    </button>
                    <button class="botao-editar">
                        <img src="/imagens/Edit.svg" alt="Icone de Editar">
                    </button>
                </div>
            </li>
            <li> Item 3
                <div>
                    <button>
                        <img src="/imagens/Trash.svg" alt="Icone de Lixeira">
                    </button>
                    <button class="botao-editar">
                        <img src="/imagens/Edit.svg" alt="Icone de Editar">
                    </button>
                </div>
            </li>
            <li> Item 4
                <div>
                    <button>
                        <img src="/imagens/Trash.svg" alt="Icone de Lixeira">
                    </button>
                    <button class="botao-editar">
                        <img src="/imagens/Edit.svg" alt="Icone de Editar">
                    </button>
                </div>
            </li>
            <li> Item 5
                <div>
                    <button>
                        <img src="/imagens/Trash.svg" alt="Icone de Lixeira">
                    </button>
                    <button class="botao-editar">
                        <img src="/imagens/Edit.svg" alt="Icone de Editar">
                    </button>
                </div>
            </li>
            <li> Item 6
                <div>
                    <button>
                        <img src="/imagens/Trash.svg" alt="Icone de Lixeira">
                    </button>
                    <button class="botao-editar">
                        <img src="/imagens/Edit.svg" alt="Icone de Editar">
                    </button>
                </div>
            </li>
            <li> Item 7
                <div>
                    <button>
                        <img src="/imagens/Trash.svg" alt="Icone de Lixeira">
                    </button>
                    <button class="botao-editar">
                        <img src="/imagens/Edit.svg" alt="Icone de Editar">
                    </button>
                </div>
            </li>
        </ul>

        <button class="botao-estilo" id="botao-adicionar"><img src="/imagens/add.svg" alt="Adicionar"></button>

        <dialog closedby="any">
            <h3 class="adicionar-item">Adicione o novo item...</h3>
            <input type="text" placeholder="Insira a descrição do item" />
            <div class="grupo-botoes">
                <button class="botao botao-principal">Salvar</button>
                <button class="botao botao-secundario" id="close">Fechar</button>
            </div>
        </dialog>

    </main>

    <footer>
        <h3>
            Desenvolvido por: Natalia Dias Fernandes
        </h3>
    </footer>
</body>

<script>
    const botao_adicionar = document.getElementById("botao-adicionar")
    const modal = document.querySelector("dialog")
    const botao_fechar = document.querySelector("dialog button#close")
    const botoes_editar = document.getElementsByClassName("botao-editar")


    botao_adicionar.onclick = function () {
        modal.showModal()
    }

    botao_fechar.onclick = function () {
        modal.close()
    }

    for (const botao_editar of botoes_editar) {
        botao_editar.addEventListener("click", function (event) {
            /***
             * @type HTMLLIElement
             **/
            const element_pai = event.target.closest("li")
            element_pai.classList.add("edicao")
            element_pai.innerHTML = `
                <input type="text" placeholder="Insira a descrição do item">
                <img src="/imagens/Save.svg" alt="Icone de salvar">
            `
        })
    };
</script>

</html>
